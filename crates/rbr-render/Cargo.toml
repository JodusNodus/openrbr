[package]
name = "rbr-render"
version = "0.1.0"
edition = "2021"
description = "wgpu renderer for Richard Burns Rally stage geometry (milestone 1: one stage, free-fly viewer)"
license = "GPL-3.0-or-later"

[[bin]]
name = "viewer"
path = "src/bin/viewer/main.rs"

[[bin]]
name = "input_check"
path = "src/bin/input_check/main.rs"

[[bin]]
name = "texture-pack"
path = "src/bin/texture-pack.rs"

[lib]
name = "rbr_render"
path = "src/lib.rs"

[features]
# The packages' build (scripts/package.sh) and CI's Ubuntu runner, which has no SDL3 package: SDL3 built from its
# source (needs cmake) and linked in, so nothing needs SDL3 installed. Only its joystick and haptic parts are used, so
# it is built without video (no X11 or Wayland).
sdl-static = ["sdl3-sys/build-from-source-static", "sdl3-sys/no-sdl-video", "sdl3-sys/sdl-unix-console-build"]

[dependencies]
rbr-counters = { path = "../rbr-counters" }
rbr-gameplay = { path = "../rbr-gameplay" }
rbr-physics = { path = "../rbr-physics" }
rbr-recording = { path = "../rbr-recording" }
rbr-formats = { path = "../rbr-formats" }
rbr-sound = { path = "../rbr-sound" }
bytemuck = { version = "1.25", features = ["derive"] }
egui = { version = "0.37", features = ["default_fonts"] }  # 0.33 had them by default
egui-wgpu = { version = "0.37", default-features = false }
futures-executor = "0.3"
glam = "0.33"
png = "0.18"
wgpu = "30"
winit = "0.30"
gilrs = "0.11"
sdl3-sys = "0.7"
texpresso = { version = "2.0.2", features = ["rayon"] }

# The viewer's `RBR_LATENCY`: the compositor's presentation feedback on winit's Wayland connection.
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
libc = "0.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The joysticks off Linux (`devices`): gilrs's platform layer, for its axis and button lists.
[target.'cfg(not(target_os = "linux"))'.dependencies]
gilrs-core = "0.6"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out"] }
